name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify lib is committed & current
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::lib/ is stale. Run 'pnpm build' and commit lib/ so a github install ships its entry files."
            exit 1
          fi
          echo "lib/ is committed and in sync with src."
